# Run: `docker compose up --build`
services:
  tgfeed:
    build:
      context: .
      dockerfile: Dockerfile
    image: tgfeed:latest
    container_name: tgfeed
    env_file: .env
    ports:
      - "8792:8792"
    volumes:
      - tgfeed-data:/data
    restart: unless-stopped

volumes:
  tgfeed-data:
